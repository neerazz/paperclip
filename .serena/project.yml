# ============================================================================
# paperclip — Serena Configuration
# Paperclip control plane — TypeScript monorepo (cli, packages, evals)
# ============================================================================

project_name: paperclip

languages:
- typescript

encoding: utf-8

ignore_all_files_in_gitignore: true

ignored_paths:
- .git
- node_modules
- dist
- build
- .turbo
- .next
- "**/coverage"

read_only: false

excluded_tools: []
included_optional_tools: []
fixed_tools: []

index:
  include:
  - "**/*.ts"
  - "**/*.tsx"
  - "**/*.js"
  - "**/*.json"
  - "**/*.md"
  exclude:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/.git/**"
  - "**/.turbo/**"

base_modes:
default_modes:
added_modes:

initial_prompt: |
  ## paperclip — control plane and CLI

  **Purpose**: Paperclip control plane API — task assignment, agent
  coordination, governance, evals.
  **Stack**: TypeScript monorepo (pnpm workspace, ~1000 .ts + ~250 .tsx files).

  ### Layout
  - `cli/` — Paperclip CLI
  - `packages/` — shared packages
  - `evals/` — evaluation suites
  - `doc/`, `docs/` — documentation
  - `docker/`, `Dockerfile` — containerization
  - `patches/` — pnpm patches

  ### When working here
  - Use `pnpm` (not npm/yarn). Workspace protocol is in use.
  - `AGENTS.md` and `CONTRIBUTING.md` describe the agent contract — read
    before changing agent-facing surfaces.
  - The `paperclip-dev` skill manages local instances; prefer it for
    starting/stopping/seeding.

read_only_memory_patterns: []
ignored_memory_patterns: []

ls_specific_settings: {}
language_backend:
line_ending:
symbol_info_budget:
